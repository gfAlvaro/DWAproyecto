<h1>Contacta con nosotros</h1>
<form class="contactForm" [formGroup]="contactoForm" (ngSubmit)="onSubmit()">
  <input type="text" formControlName="name" placeholder="Nombre">
  @if (contactoForm.get('name')?.invalid && contactoForm.get('name')?.touched) {
    <div style="color:red">
      El nombre es obligatorio.
    </div>
  }
  <input type="email" formControlName="email" placeholder="Email">
  @if (contactoForm.get('email')?.invalid && contactoForm.get('email')?.touched) {
    <div style="color:red">
      Introduce un email válido.
    </div>
  }
  <input type="text" formControlName="subject" placeholder="Asunto">
  <textarea formControlName="message" placeholder="Mensaje"></textarea>
  <button type="submit" [disabled]="contactoForm.invalid || enviando">Enviar</button>
</form>
