<div class="client-login">
  <h1>Inicia sesión</h1>
  <form (ngSubmit)="login()">
    <div class="campo">
      <input type="email" name="email" [(ngModel)]="email" autocomplete="username" placeholder="Email">
    </div>
    <div class="campo">
      <input type="password" name="password" [(ngModel)]="password" autocomplete="current-password" placeholder="Contraseña" >
    </div>
    <div *ngIf="error">
      {{ error }}
    </div>
    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Entrando...' : 'Iniciar sesión' }}
    </button>
  </form>
  <p>¿Aún no tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
</div>div
