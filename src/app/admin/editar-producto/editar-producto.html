<h2>Editar producto</h2>

@if (cargando) {

  <p>Cargando producto...</p>

} @else {

  @if (error) {
    <p class="error">
      {{ error }}
    </p>
  }

  @if (mensaje) {
    <p class="mensaje">
      {{ mensaje }}
    </p>
  }

  <form
    [formGroup]="formulario"
    (ngSubmit)="guardar()"
  >

    <div>
      <label for="nombreProducto">
        Nombre
      </label>

      <input
        id="nombreProducto"
        type="text"
        formControlName="nombreProducto"
      >
    </div>

    <div>
      <label for="slug">
        Slug
      </label>

      <input
        id="slug"
        type="text"
        formControlName="slug"
      >
    </div>

    <div>
      <label for="descripcion">
        Descripción
      </label>

      <textarea
        id="descripcion"
        formControlName="descripcion"
      ></textarea>
    </div>

    <div>
      <label for="precio">
        Precio
      </label>

      <input
        id="precio"
        type="number"
        step="0.01"
        formControlName="precio"
      >
    </div>

    <div>
      <label for="stock">
        Stock
      </label>

      <input
        id="stock"
        type="number"
        formControlName="stock"
      >
    </div>

    <!-- IMAGEN -->
  <div class="campo">
  <label for="imagen">
    Imagen del producto
  </label>
  <input
    id="imagen"
    type="file"
    accept="image/png,image/jpeg,image/webp"
    (change)="seleccionarImagen($event)"
  >
  <small>
    Formatos permitidos: JPG, PNG o WebP. Máximo 5 MB.
  </small>
</div>

@if (previewImagen) {
  <div class="preview">
    <p>Vista previa:</p>
    <img
      [src]="previewImagen"
      alt="Vista previa del producto"
    >
  </div>
}

@if (error) {
  <div class="error">
    {{ error }}
  </div>
}

    <div>

      <button
        type="submit"
        [disabled]="guardando"
      >
        {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
      </button>

      <button
        type="button"
        (click)="cancelar()"
      >
        Cancelar
      </button>

    </div>

  </form>
}
