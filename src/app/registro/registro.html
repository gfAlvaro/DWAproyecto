<div class="registro-container">
  <h1>Regístrate en nuestra web</h1>
  <form [formGroup]="formRegistro" (ngSubmit)="enviar()">
    <div class="campo">
      <input type="text" formControlName="nombre" placeholder="Nombre*">
      <span *ngIf="formRegistro.get('nombre')?.touched && formRegistro.get('nombre')?.invalid" style="color:red;">El nombre es obligatorio.</span>
    </div>
    <div class="campo">
      <input type="text" formControlName="apellido" placeholder="Apellidos*">
      <span *ngIf="formRegistro.get('apellido')?.touched && formRegistro.get('apellido')?.invalid" style="color:red;">El apellido es obligatorio.</span>
    </div>
    <div class="campo">
      <input type="email" formControlName="email" placeholder="Correo Electrónico*">
      <span *ngIf="formRegistro.get('email')?.touched && formRegistro.get('email')?.invalid" style="color:red;">Introduce un email válido.</span>
    </div>
    <div class="campo">
      <input type="password" formControlName="password" placeholder="Contraseña*">
      <span *ngIf="formRegistro.get('password')?.touched && formRegistro.get('password')?.invalid" style="color:red;">Mínimo 6 caracteres.</span>
    </div>
    <div class="campo">
      <input type="text" formControlName="telefono" placeholder="Teléfono">
    </div>
    <div class="campo">
      <input type="text" formControlName="direccion" placeholder="Dirección de Envío">
    </div>
    <button type="submit" [disabled]="formRegistro.invalid">Crear Cuenta</button>
  </form>
  <p *ngIf="mensajeExito" style="color: green;">{{ mensajeExito }}</p>
  <p *ngIf="mensajeError" style="color: red;">{{ mensajeError }}</p>
</div>
