<h1>Nuestros productos</h1>
<div class="productos-grid">
  @for (producto of (productos$ | async); track producto.productoID) {
    <div class="producto">
      <a href="/productos/{{ producto.slug }}" target="_blank">
      <img src="{{ producto.pathImagen }}" alt="{{ producto.nombreProducto }}">
      </a>
      <a href="/productos/{{ producto.slug }}" target="_blank">
        <h3>{{ producto.nombreProducto }}</h3>
      </a>
      <p>{{ producto.precio }} €</p>
    </div>
  } @empty {
    <p>Próximamente...</p>
  }
</div>
